services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_password
      POSTGRES_DB: aether_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aether-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aether-backend
    environment:
      DATABASE_URL: postgresql://aether:aether_password@postgres:5432/aether_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production-12345}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      MEDIA_ROOT: /media
      TRANSCODE_ROOT: /transcode
      LOG_LEVEL: info
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGINS: "*"
    volumes:
      - ${MEDIA_ROOT:-./media}:/media:ro
      - transcode_data:/transcode
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aether-network
    restart: unless-stopped

  # Frontend (Production build served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aether-frontend
    depends_on:
      - backend
    networks:
      - aether-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aether-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aether-network
    restart: unless-stopped

networks:
  aether-network:
    driver: bridge

volumes:
  postgres_data:
  transcode_data:
